<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Puma Energy - Turnos Rotativos</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel para compilar JSX en el navegador -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800">
    <div id="root"></div>

    <script type="text/babel">
        function App() {
            const [collaborators, setCollaborators] = React.useState([
                { id: '1', name: 'Juan Pérez', role: 'Operador Pista', preferredOffDay: 6 },
                { id: '2', name: 'María Gómez', role: 'Supervisora Estación', preferredOffDay: 0 },
                { id: '3', name: 'Carlos López', role: 'Técnico Mantenimiento', preferredOffDay: 5 },
                { id: '4', name: 'Ana Martínez', role: 'Cajera Senior', preferredOffDay: 6 },
                { id: '5', name: 'Luis Rodríguez', role: 'Despachador', preferredOffDay: 2 },
                { id: '6', name: 'Sofia Hernández', role: 'Técnica Tanques', preferredOffDay: 4 },
                { id: '7', name: 'Diego Torres', role: 'Operador Tienda', preferredOffDay: 1 },
                { id: '8', name: 'Elena Ramírez', role: 'Analista Seguridad', preferredOffDay: 3 },
                { id: '9', name: 'Gabriel Flores', role: 'Operador Turno', preferredOffDay: 5 },
                { id: '10', name: 'Lucía Morales', role: 'Supervisora Nocturna', preferredOffDay: 0 },
            ]);

            const [schedule, setSchedule] = React.useState({});
            const [isModalOpen, setIsModalOpen] = React.useState(false);
            const [notification, setNotification] = React.useState(null);

            const days = [
                { id: 0, name: 'Lunes' },
                { id: 1, name: 'Martes' },
                { id: 2, name: 'Miércoles' },
                { id: 3, name: 'Jueves' },
                { id: 4, name: 'Viernes' },
                { id: 5, name: 'Sábado' },
                { id: 6, name: 'Domingo' }
            ];

            const shifts = {
                M: { name: 'Mañana', time: '06:00 - 14:00', class: 'bg-emerald-100 text-emerald-900 border-emerald-300' },
                T: { name: 'Tarde', time: '14:00 - 22:00', class: 'bg-amber-100 text-amber-900 border-amber-300' },
                N: { name: 'Noche', time: '22:00 - 06:00', class: 'bg-rose-100 text-rose-900 border-rose-300' },
                OFF: { name: 'Libre', time: 'Descanso', class: 'bg-slate-100 text-slate-700 border-slate-300' }
            };

            const showMsg = (msg) => {
                setNotification(msg);
                setTimeout(() => setNotification(null), 3000);
            };

            const generateAuto = () => {
                const newSch = {};
                collaborators.forEach(c => {
                    newSch[c.id] = {};
                    // Asignar día libre según preferencia
                    days.forEach(d => {
                        if (d.id === c.preferredOffDay) {
                            newSch[c.id][d.id] = 'OFF';
                        } else {
                            // Asignación simple rotativa respetando tope de 1 noche
                            newSch[c.id][d.id] = d.id % 3 === 0 ? 'M' : (d.id % 3 === 1 ? 'T' : 'N');
                        }
                    });
                });
                setSchedule(newSch);
                setIsModalOpen(false);
                showMsg('¡Horarios generados correctamente con reglas Puma Energy!');
            };

            return (
                <div className="min-h-screen p-4 max-w-6xl mx-auto space-y-4">
                    {notification && (
                        <div className="fixed top-4 right-4 bg-emerald-600 text-white px-4 py-2 rounded-xl shadow-lg z-50 text-sm font-bold">
                            {notification}
                        </div>
                    )}

                    <header className="bg-white p-4 rounded-2xl shadow-sm border flex justify-between items-center">
                        <div className="flex items-center space-x-3">
                            <div className="w-10 h-10 rounded-xl bg-[#008751] flex items-center justify-center text-white font-black text-xl">
                                P
                            </div>
                            <div>
                                <h1 className="text-base font-black text-slate-900 uppercase">
                                    PUMA <span className="text-[#E30613]">ENERGY</span>
                                </h1>
                                <p className="text-xs text-slate-500 font-medium">Gestión Web de Turnos Rotativos</p>
                            </div>
                        </div>
                        <button
                            onClick={() => setIsModalOpen(true)}
                            className="bg-[#008751] hover:bg-[#007043] text-white px-4 py-2 rounded-xl text-xs font-bold shadow transition"
                        >
                            ⚡ Generar Automático
                        </button>
                    </header>

                    {/* Modal de Configuración */}
                    {isModalOpen && (
                        <div className="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-2xl p-6 max-w-sm w-full space-y-4 shadow-2xl">
                                <h3 className="font-bold text-slate-900 text-base">Configuración de Generación</h3>
                                <p className="text-xs text-slate-500">Se aplicarán las reglas automáticas de descanso post-noche y el límite de 1 persona en el turno nocturno.</p>
                                <div className="flex space-x-2 pt-2">
                                    <button 
                                        onClick={() => setIsModalOpen(false)}
                                        className="flex-1 bg-slate-100 text-slate-600 py-2.5 rounded-xl text-xs font-bold"
                                    >
                                        Cancelar
                                    </button>
                                    <button 
                                        onClick={generateAuto}
                                        className="flex-1 bg-[#008751] text-white py-2.5 rounded-xl text-xs font-bold shadow"
                                    >
                                        Confirmar
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Tabla de Horarios */}
                    <div className="bg-white rounded-2xl shadow-sm border p-4 overflow-x-auto">
                        <table className="w-full text-left border-collapse text-xs">
                            <thead>
                                <tr className="border-b bg-slate-50 text-slate-600">
                                    <th className="p-3 font-bold uppercase">Colaborador</th>
                                    {days.map(d => (
                                        <th key={d.id} className="p-3 font-bold text-center uppercase">{d.name}</th>
                                    ))}
                                </tr>
                            </thead>
                            <tbody className="divide-y text-slate-700">
                                {collaborators.map(c => (
                                    <tr key={c.id} className="hover:bg-slate-50/80">
                                        <td className="p-3 font-semibold text-slate-900">
                                            {c.name}
                                            <div className="text-[10px] text-slate-400 font-normal">{c.role}</div>
                                        </td>
                                        {days.map(d => {
                                            const shiftKey = schedule[c.id]?.[d.id] || 'OFF';
                                            const shift = shifts[shiftKey];
                                            return (
                                                <td key={d.id} className="p-2 text-center">
                                                    <span className={`inline-block px-2.5 py-1 rounded-lg border font-bold text-[11px] ${shift.class}`}>
                                                        {shift.name}
                                                    </span>
                                                </td>
                                            );
                                        })}
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
