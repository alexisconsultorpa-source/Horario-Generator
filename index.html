<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Puma Energy - Gestión de Turnos Rotativos</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel para compilar JSX en el navegador -->
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @media print {
            @page {
                size: letter landscape !important;
                margin: 0.3in !important;
            }
            body { 
                background: white !important; 
                font-size: 9.5px !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
            button, .no-print { 
                display: none !important; 
            }
            .shadow-sm, .shadow-2xl, .border { 
                box-shadow: none !important; 
                border-color: #cbd5e1 !important; 
            }
            input {
                border: none !important;
                background: transparent !important;
                padding: 0 !important;
            }
            .print-container {
                width: 100% !important;
                max-width: 100% !important;
                padding: 0 !important;
                margin: 0 !important;
            }
            table {
                width: 100% !important;
                table-layout: auto !important;
            }
            th, td {
                padding: 4px 6px !important;
            }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans">
    <div id="root"></div>

    <script type="text/babel">
        function App() {
            const [stationName, setStationName] = React.useState('Puma Estación Central');
            const [managerName, setManagerName] = React.useState('Encargado de Turnos');
            const [startDate, setStartDate] = React.useState('2026-11-02');
            const [endDate, setEndDate] = React.useState('2026-11-08');

            const [collaborators, setCollaborators] = React.useState([
                { id: '1', name: 'Juan Pérez', role: 'Operador Pista' },
                { id: '2', name: 'María Gómez', role: 'Supervisora' },
                { id: '3', name: 'Carlos López', role: 'Despachador' },
                { id: '4', name: 'Ana Martínez', role: 'Cajera' },
                { id: '5', name: 'Luis Rodríguez', role: 'Operador Pista' },
                { id: '6', name: 'Sofia Hernández', role: 'Asistente' },
            ]);

            const [schedule, setSchedule] = React.useState({});
            const [isModalOpen, setIsModalOpen] = React.useState(false);
            const [isSettingsOpen, setIsSettingsOpen] = React.useState(false);
            const [notification, setNotification] = React.useState(null);

            const [newName, setNewName] = React.useState('');
            const [newRole, setNewRole] = React.useState('');

            const [shiftTimes, setShiftTimes] = React.useState({
                M: { name: 'Mañana', start: '06:00', end: '14:00', color: 'bg-emerald-100 text-emerald-900 border-emerald-300' },
                I: { name: 'Intermedio', start: '10:00', end: '18:00', color: 'bg-teal-100 text-teal-900 border-teal-300' },
                T: { name: 'Tarde', start: '14:00', end: '22:00', color: 'bg-amber-100 text-amber-900 border-amber-300' },
                N: { name: 'Noche', start: '22:00', end: '06:00', color: 'bg-rose-100 text-rose-900 border-rose-300' },
                OFF: { name: 'Libre', start: 'Descanso', end: '', color: 'bg-slate-100 text-slate-700 border-slate-300' }
            });

            const [requirements, setRequirements] = React.useState({
                M: 2,
                I: 1,
                T: 2,
                N: 1 
            });

            const [enableIntermediate, setEnableIntermediate] = React.useState(true);

            // Generar dinámicamente los días basados en el rango de fechas seleccionado
            const dynamicDays = React.useMemo(() => {
                const daysList = [];
                let current = new Date(startDate + 'T00:00:00');
                const last = new Date(endDate + 'T00:00:00');

                let index = 0;
                while (current <= last && index < 31) {
                    const dateStr = current.toISOString().slice(0, 10);
                    const dayName = current.toLocaleDateString('es-ES', { weekday: 'short' });
                    const formattedDate = current.toLocaleDateString('es-ES', { day: '2-digit', month: '2-digit' });
                    
                    daysList.push({
                        id: index,
                        dateStr: dateStr,
                        name: `${dayName.charAt(0).toUpperCase() + dayName.slice(1)} ${formattedDate}`
                    });

                    current.setDate(current.getDate() + 1);
                    index++;
                }
                return daysList;
            }, [startDate, endDate]);

            const showMsg = (msg, type = 'success') => {
                setNotification({ msg, type });
                setTimeout(() => setNotification(null), 3500);
            };

            const handleAddCollab = (e) => {
                e.preventDefault();
                if (!newName.trim()) return;
                const newItem = {
                    id: Date.now().toString(),
                    name: newName.trim(),
                    role: newRole.trim() || 'Colaborador'
                };
                setCollaborators([...collaborators, newItem]);
                setNewName('');
                setNewRole('');
                showMsg(`Colaborador ${newItem.name} agregado con éxito.`);
            };

            const handleDeleteCollab = (id, name) => {
                setCollaborators(collaborators.filter(c => c.id !== id));
                const newSch = { ...schedule };
                delete newSch[id];
                setSchedule(newSch);
                showMsg(`Colaborador ${name} eliminado.`, 'error');
            };

            const handleUpdateCollabField = (id, field, value) => {
                setCollaborators(collaborators.map(c => c.id === id ? { ...c, [field]: value } : c));
            };

            const handleManualChange = (collabId, dayId, shiftKey) => {
                setSchedule(prev => ({
                    ...prev,
                    [collabId]: {
                        ...(prev[collabId] || {}),
                        [dayId]: shiftKey
                    }
                }));
            };

            const executeAutoGeneration = () => {
                const newSch = {};
                collaborators.forEach(c => { newSch[c.id] = {}; });

                const activeKeys = ['M', 'T', 'N'];
                if (enableIntermediate) activeKeys.push('I');

                collaborators.forEach((c, idx) => {
                    const offDayIndex = idx % dynamicDays.length; 
                    newSch[c.id][offDayIndex] = 'OFF';
                });

                dynamicDays.forEach(day => {
                    const dayId = day.id;
                    const available = collaborators.filter(c => newSch[c.id][dayId] !== 'OFF');
                    const assignedToday = {};

                    available.forEach(c => {
                        if (dayId > 0 && schedule[c.id]?.[dayId - 1] === 'N') {
                            newSch[c.id][dayId] = 'OFF';
                            assignedToday[c.id] = 'OFF';
                        }
                    });

                    const nightCandidate = available.find(c => !assignedToday[c.id]);
                    if (nightCandidate) {
                        newSch[nightCandidate.id][dayId] = 'N';
                        assignedToday[nightCandidate.id] = 'N';
                    }

                    activeKeys.forEach(shiftKey => {
                        if (shiftKey === 'N') return; 
                        const needed = requirements[shiftKey] || 0;

                        for (let i = 0; i < needed; i++) {
                            const candidate = available.find(c => {
                                if (assignedToday[c.id]) return false;
                                if (dayId > 0 && newSch[c.id][dayId - 1] === 'N') return false;
                                return true;
                            }) || available.find(c => !assignedToday[c.id]);

                            if (candidate) {
                                newSch[candidate.id][dayId] = shiftKey;
                                assignedToday[candidate.id] = shiftKey;
                            }
                        }
                    });

                    available.forEach(c => {
                        if (!assignedToday[c.id]) {
                            const prev = dayId > 0 ? newSch[c.id][dayId - 1] : null;
                            if (prev === 'N') {
                                newSch[c.id][dayId] = 'OFF';
                            } else {
                                newSch[c.id][dayId] = 'M';
                            }
                        }
                    });
                });

                setSchedule(newSch);
                setIsModalOpen(false);
                showMsg('¡Horarios generados correctamente con reglas de descanso post-noche!');
            };

            const exportToPDF = () => {
                window.print();
            };

            return (
                <div className="min-h-screen p-4 max-w-7xl mx-auto space-y-6 print-container">
                    {notification && (
                        <div className="fixed top-4 right-4 z-50 px-4 py-3 rounded-xl shadow-xl text-sm font-bold border bg-emerald-50 text-[#008751] border-emerald-300 no-print">
                            {notification.msg}
                        </div>
                    )}

                    {/* HEADER PUMA ENERGY */}
                    <header className="bg-white p-4 rounded-2xl shadow-sm border flex flex-col md:flex-row justify-between items-center gap-4">
                        <div className="flex items-center space-x-3">
                            <div className="w-11 h-11 rounded-xl bg-[#008751] flex items-center justify-center text-white font-black text-2xl shadow-md border-2 border-[#E30613]">
                                P
                            </div>
                            <div>
                                <h1 className="text-lg font-black text-slate-900 tracking-tight uppercase">
                                    PUMA <span className="text-[#E30613]">ENERGY</span>
                                </h1>
                                <input 
                                    type="text" 
                                    value={stationName} 
                                    onChange={e => setStationName(e.target.value)} 
                                    className="text-xs font-bold text-slate-700 bg-transparent border-b border-dashed border-slate-300 outline-none w-full"
                                    placeholder="Nombre de la Estación"
                                />
                            </div>
                        </div>

                        {/* Datos de planeación y fechas */}
                        <div className="flex flex-col sm:flex-row items-center gap-3 text-xs">
                            <div className="flex items-center space-x-1.5 bg-slate-50 px-3 py-1.5 rounded-xl border">
                                <span className="font-bold text-slate-600">Desde:</span>
                                <input type="date" value={startDate} onChange={e => setStartDate(e.target.value)} className="font-semibold bg-transparent outline-none" />
                                <span className="font-bold text-slate-600">Hasta:</span>
                                <input type="date" value={endDate} onChange={e => setEndDate(e.target.value)} className="font-semibold bg-transparent outline-none" />
                                <span className="text-slate-500 font-bold ml-1">({dynamicDays.length} días)</span>
                            </div>
                            <div className="flex items-center space-x-1.5 bg-slate-50 px-3 py-1.5 rounded-xl border">
                                <span className="font-bold text-slate-600">Encargado:</span>
                                <input type="text" value={managerName} onChange={e => setManagerName(e.target.value)} className="font-semibold bg-transparent outline-none w-28" />
                            </div>
                        </div>

                        {/* Botones de acción */}
                        <div className="flex items-center space-x-2 no-print">
                            <button
                                onClick={exportToPDF}
                                className="bg-slate-800 hover:bg-slate-900 text-white px-3.5 py-2 rounded-xl text-xs font-bold transition flex items-center space-x-1.5 shadow"
                            >
                                📄 Exportar PDF
                            </button>
                            <button
                                onClick={() => setIsSettingsOpen(true)}
                                className="bg-slate-100 hover:bg-slate-200 text-slate-700 px-3.5 py-2 rounded-xl text-xs font-bold transition flex items-center space-x-1.5"
                            >
                                ⚙️ Editar Horas
                            </button>
                            <button
                                onClick={() => setIsModalOpen(true)}
                                className="bg-[#008751] hover:bg-[#007043] text-white px-4 py-2 rounded-xl text-xs font-bold shadow-md transition flex items-center space-x-1.5"
                            >
                                ⚡ Generador Automático
                            </button>
                        </div>
                    </header>

                    {/* MODAL CONFIGURACIÓN AUTOMÁTICA */}
                    {isModalOpen && (
                        <div className="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4 no-print">
                            <div className="bg-white rounded-2xl p-6 max-w-md w-full space-y-4 shadow-2xl">
                                <h3 className="font-bold text-slate-900 text-base border-b pb-2">Configurar Cantidad por Turno</h3>
                                
                                <div className="space-y-3 text-xs">
                                    <div>
                                        <label className="font-bold text-slate-700">Personal en Turno Mañana:</label>
                                        <input type="number" min="1" max="4" value={requirements.M} onChange={e => setRequirements({...requirements, M: Number(e.target.value)})} className="w-full mt-1 border rounded-lg p-2 font-bold" />
                                    </div>
                                    <div className="flex items-center justify-between border-t pt-2">
                                        <span className="font-bold text-slate-700">Incluir Turno Intermedio</span>
                                        <input type="checkbox" checked={enableIntermediate} onChange={e => setEnableIntermediate(e.target.checked)} className="w-4 h-4 accent-[#008751]" />
                                    </div>
                                    {enableIntermediate && (
                                        <div>
                                            <label className="font-bold text-slate-700">Personal en Turno Intermedio:</label>
                                            <input type="number" min="1" max="4" value={requirements.I} onChange={e => setRequirements({...requirements, I: Number(e.target.value)})} className="w-full mt-1 border rounded-lg p-2 font-bold" />
                                        </div>
                                    )}
                                    <div className="border-t pt-2">
                                        <label className="font-bold text-slate-700">Personal en Turno Tarde:</label>
                                        <input type="number" min="1" max="4" value={requirements.T} onChange={e => setRequirements({...requirements, T: Number(e.target.value)})} className="w-full mt-1 border rounded-lg p-2 font-bold" />
                                    </div>
                                    <div className="border-t pt-2">
                                        <label className="font-bold text-slate-700">Personal en Turno Noche (Máximo 1 estricto):</label>
                                        <input type="number" value="1" disabled className="w-full mt-1 border rounded-lg p-2 bg-slate-100 text-slate-500 font-bold cursor-not-allowed" />
                                    </div>
                                </div>

                                <div className="flex space-x-2 pt-3">
                                    <button onClick={() => setIsModalOpen(false)} className="flex-1 bg-slate-100 text-slate-600 py-2.5 rounded-xl text-xs font-bold">Cancelar</button>
                                    <button onClick={executeAutoGeneration} className="flex-1 bg-[#008751] text-white py-2.5 rounded-xl text-xs font-bold shadow">Generar con Reglas</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* MODAL EDITAR HORAS */}
                    {isSettingsOpen && (
                        <div className="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4 no-print">
                            <div className="bg-white rounded-2xl p-6 max-w-lg w-full space-y-4 shadow-2xl">
                                <h3 className="font-bold text-slate-900 text-base border-b pb-2">Editar Horas de Entrada y Salida</h3>
                                <div className="space-y-3 text-xs">
                                    {Object.keys(shiftTimes).map(key => {
                                        if (key === 'OFF') return null;
                                        const s = shiftTimes[key];
                                        return (
                                            <div key={key} className="flex items-center justify-between bg-slate-50 p-2.5 rounded-xl border">
                                                <span className="font-bold uppercase w-24">{s.name}</span>
                                                <div className="flex items-center space-x-2">
                                                    <input type="text" value={s.start} onChange={e => setShiftTimes({...shiftTimes, [key]: {...s, start: e.target.value}})} className="border rounded px-2 py-1 w-20 text-center font-bold" />
                                                    <span>a</span>
                                                    <input type="text" value={s.end} onChange={e => setShiftTimes({...shiftTimes, [key]: {...s, end: e.target.value}})} className="border rounded px-2 py-1 w-20 text-center font-bold" />
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                                <button onClick={() => setIsSettingsOpen(false)} className="w-full bg-[#008751] text-white py-2.5 rounded-xl text-xs font-bold shadow">Guardar Cambios</button>
                            </div>
                        </div>
                    )}

                    {/* GESTIÓN DE PLANTILLA */}
                    <div className="bg-white rounded-2xl shadow-sm border p-4 space-y-4 no-print">
                        <h2 className="text-xs font-black uppercase text-slate-500 tracking-wider">Administrar Plantilla (Agregar o Quitar Colaboradores)</h2>
                        <form onSubmit={handleAddCollab} className="flex flex-col sm:flex-row gap-2">
                            <input type="text" placeholder="Nombre del colaborador" value={newName} onChange={e => setNewName(e.target.value)} className="border rounded-xl px-3 py-2 text-xs flex-1 outline-none focus:ring-2 focus:ring-[#008751]" />
                            <input type="text" placeholder="Puesto / Rol" value={newRole} onChange={e => setNewRole(e.target.value)} className="border rounded-xl px-3 py-2 text-xs flex-1 outline-none focus:ring-2 focus:ring-[#008751]" />
                            <button type="submit" className="bg-[#008751] hover:bg-[#007043] text-white px-4 py-2 rounded-xl text-xs font-bold transition shadow">＋ Agregar Colaborador</button>
                        </form>
                    </div>

                    {/* MATRIZ DE HORARIOS */}
                    <div className="bg-white rounded-2xl shadow-sm border p-4 overflow-x-auto">
                        <div className="hidden print:block mb-3 text-center">
                            <h2 className="text-xs font-black uppercase">PUMA ENERGY - {stationName}</h2>
                            <p className="text-[10px]">Planeación de Turnos | Período: {startDate} al {endDate} ({dynamicDays.length} días) | Encargado: {managerName}</p>
                        </div>

                        <table className="w-full text-left border-collapse text-xs">
                            <thead>
                                <tr className="border-b bg-slate-50 text-slate-600">
                                    <th className="p-2.5 font-bold uppercase">Colaborador</th>
                                    {dynamicDays.map(d => (
                                        <th key={d.id} className="p-2.5 font-bold text-center uppercase whitespace-nowrap">{d.name}</th>
                                    ))}
                                    <th className="p-2.5 font-bold text-center uppercase no-print">Acción</th>
                                </tr>
                            </thead>
                            <tbody className="divide-y text-slate-700">
                                {collaborators.map(c => (
                                    <tr key={c.id} className="hover:bg-slate-50/80">
                                        <td className="p-2.5 font-semibold text-slate-950 whitespace-nowrap">
                                            <input 
                                                type="text" 
                                                value={c.name} 
                                                onChange={e => handleUpdateCollabField(c.id, 'name', e.target.value)}
                                                className="w-full font-bold bg-transparent outline-none focus:bg-slate-100 rounded px-1"
                                            />
                                            <div className="text-[10px] text-slate-400 font-normal">
                                                <input 
                                                    type="text" 
                                                    value={c.role} 
                                                    onChange={e => handleUpdateCollabField(c.id, 'role', e.target.value)}
                                                    className="w-full bg-transparent outline-none focus:bg-slate-100 rounded px-1"
                                                />
                                            </div>
                                        </td>
                                        {dynamicDays.map(d => {
                                            const shiftKey = schedule[c.id]?.[d.id] || 'OFF';
                                            const shiftObj = shiftTimes[shiftKey] || shiftTimes.OFF;
                                            return (
                                                <td key={d.id} className="p-1.5 text-center">
                                                    <select
                                                        value={shiftKey}
                                                        onChange={(e) => handleManualChange(c.id, d.id, e.target.value)}
                                                        className={`text-[11px] font-bold px-1.5 py-1 rounded-lg border cursor-pointer ${shiftObj.color}`}
                                                    >
                                                        {Object.keys(shiftTimes).map(k => {
                                                            if (k === 'I' && !enableIntermediate) return null;
                                                            return (
                                                                <option key={k} value={k}>
                                                                    {shiftTimes[k].name} ({k})
                                                                </option>
                                                            );
                                                        })}
                                                    </select>
                                                </td>
                                            );
                                        })}
                                        <td className="p-2 text-center no-print">
                                            <button onClick={() => handleDeleteCollab(c.id, c.name)} className="text-rose-500 hover:text-rose-700 font-bold text-xs p-1" title="Eliminar colaborador">🗑️</button>
                                        </td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
